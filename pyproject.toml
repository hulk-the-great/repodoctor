[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repodoctor"
version = "0.4.0"
description = "A multi-agent test-verified GitHub issue repair system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "streamlit>=1.36.0",
    "pandas>=2.0.0"
]

[project.scripts]
repodoctor = "repodoctor.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["repodoctor*"]
